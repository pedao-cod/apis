    <link rel="stylesheet" href="style.css" />

  <body>
    <nav>
      <a href="homeAPI.html">Página Principal (Home)</a>
      <a href="CEP.html">Consultar CEP</a>

    <main class="container-home">
      <h1>Explorador de Países</h1>

      <label for="nomePais"
        >Digite o nome do país (ex: Brasil, Japan, Canada):</label
      ><br />
      <input type="text" id="nomePais" placeholder="Nome do país" /><br /><br />

      <input type="button" onclick="consultarPais()" value="Pesquisar País" />

      <hr style="margin: 20px 0" />

      <h3>Resultados:</h3>

      <img
        id="bandeira"
        src=""
        alt="Bandeira do País"
        style="
          display: none;
          width: 150px;
          border: 1px solid #ccc;
          border-radius: 5px;
        "
      /><br /><br />

      <label>Capital:</label><br />
      <input type="text" id="capitalPais" readonly /><br /><br />

      <label>População:</label><br />
      <input type="text" id="populacaoPais" readonly /><br /><br />
    </main>
    <script src="script.js" defer></script>
  </body>
