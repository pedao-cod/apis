    <main class="container-home" style="text-align: center">
      <h1>Gerador de Cachorrinhos 🐶</h1>
      <p>
        Clique no botão abaixo para receber uma foto aleatória de um doguinho!
      </p>

      <input
        type="button"
        id="btnCachorro"
        onclick="gerarCachorro()"
        value="Gerar Foto!"
      />

      <hr style="margin: 20px 0" />

      <div
        style="
          min-height: 300px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <p
          id="mensagemCarregando"
          style="display: none; font-weight: bold; color: #64748b"
        >
          Buscando doguinho...
        </p>

        <img
          id="fotoCachorro"
          src=""
          alt="Foto de um cachorro fofo"
          style="
            display: none;
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
          "
        />
      </div>
    </main>
    <script src="script.js" defer></script>
  </body>
